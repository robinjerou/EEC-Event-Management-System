<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Menu - The Perfect Paws PH</title>
    <link rel="icon" type="image/x-icon" href="assets/resources/favicon.png">
    <link rel="stylesheet" href="assets/css/inventory-menu-style.css">
</head>
<body>
    <header class="banner">
        <div class="logo-container">
            <img src="assets/resources/logo.png" alt="Logo" class="logo">
            <div class="logo-text">
                Welcome, Placeholder
                <!-- Username Here -->
            </div>
        </div>
        <h1 class="title">Inventory Management System</h1>
        <a href="main-login.html" class="logout">Log Out</a>
    </header>

    <div class="menu">
        <a href="ims-purchase-history.html" class="card">
            <img src="assets/resources/ims-purchase-history.png" alt="View Sales">
            <div class="card-title">Purchase History</div>
            <div class="card-description">Check the latest purchase history</div>
        </a>
        <a href="ims-add-products.html" class="card">
            <img src="assets/resources/ims-add-product.png" alt="Add Product">
            <div class="card-title">Add Product</div>
            <div class="card-description">Add new products to the inventory</div>
        </a>
        <a href="ims-view-invoice.html" class="card">
            <img src="assets/resources/ims-view-invoice.png" alt="View Invoice">
            <div class="card-title">View Invoice</div>
            <div class="card-description">Check the latest invoice history</div>
        </a>
        <a href="ims-view-inventory.html" class="card">
            <img src="assets/resources/ims-view-inventory.png" alt="View Inventory">
            <div class="card-title">View Inventory</div>
            <div class="card-description">View the current inventory stock</div>
        </a>
        <a href="ims-update-product.html" class="card">
            <img src="assets/resources/ims-edit-inventory.png" alt="Update Product">
            <div class="card-title">Update Product</div>
            <div class="card-description">Update products in inventory</div>
        </a>
    </div>
    <script src="assets/js/get-user-info.js"></script>
</body>
</html>
