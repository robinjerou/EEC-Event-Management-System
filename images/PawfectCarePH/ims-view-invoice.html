<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Invoice</title>
    <link rel="icon" type="image/x-icon" href="assets/resources/favicon.png">
    <link rel="stylesheet" href="assets/css/view-invoice-style.css">
</head>
<body>
    <header class="banner">
        <div class="logo-container">
            <img src="assets/resources/logo.png" alt="Logo" class="logo">
            <a href="ims-menu.html" class="back-button">Back</a>
            <div class="logo-text">
                <!-- Username Here -->
            </div>
        </div>
        <h1 class="title">Invoices</h1>
        <a href="main-login.html" class="logout">Log Out</a>
    </header>
    
    <div class="content">
        <div class="table-data">
            <div class="order">
                <div class="head">
                    <div class="search-box">
                        <input type="text" id="search-input" placeholder="Search...">
                        <button type="button" id="search-button">Search</button>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Receipt Code</th>
                            <th>Total (₱)</th>
                            <th>Amount Paid (₱)</th>
                            <th>Change (₱)</th>
                            <th>Date of Transaction</th>
                            <th>Cashier</th>
                        </tr>
                    </thead>
                    <tbody id="invoice-table-body">
                        <!-- Rows will be loaded here via AJAX -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="assets/js/ims-fetch-invoice.js"></script>
    <script src="assets/js/get-user-info.js"></script>
</body>
</html>
